<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title">
  <title id="title">Ñandutí circular de encaje multicolor</title>
  <defs>
    <path id="long-loop" d="M120 116C99 98 96 63 120 27c24 36 21 71 0 89Z"/>
    <path id="middle-loop" d="M120 112C106 99 106 76 120 53c14 23 14 46 0 59Z"/>
    <path id="small-loop" d="M120 118C111 109 111 94 120 80c9 14 9 29 0 38Z"/>
    <ellipse id="scallop" cx="120" cy="17" rx="12" ry="9"/>
    <path id="spoke" d="M120 17V223"/>
  </defs>

  <!-- Fine radial foundation -->
  <g fill="none" stroke="#fff" stroke-width="1.15" stroke-linecap="round" opacity=".82">
    <use href="#spoke"/>
    <use href="#spoke" transform="rotate(11.25 120 120)"/>
    <use href="#spoke" transform="rotate(22.5 120 120)"/>
    <use href="#spoke" transform="rotate(33.75 120 120)"/>
    <use href="#spoke" transform="rotate(45 120 120)"/>
    <use href="#spoke" transform="rotate(56.25 120 120)"/>
    <use href="#spoke" transform="rotate(67.5 120 120)"/>
    <use href="#spoke" transform="rotate(78.75 120 120)"/>
    <use href="#spoke" transform="rotate(90 120 120)"/>
    <use href="#spoke" transform="rotate(101.25 120 120)"/>
    <use href="#spoke" transform="rotate(112.5 120 120)"/>
    <use href="#spoke" transform="rotate(123.75 120 120)"/>
    <use href="#spoke" transform="rotate(135 120 120)"/>
    <use href="#spoke" transform="rotate(146.25 120 120)"/>
    <use href="#spoke" transform="rotate(157.5 120 120)"/>
    <use href="#spoke" transform="rotate(168.75 120 120)"/>
  </g>

  <!-- Sixteen interlaced lace petals -->
  <g fill="none" stroke="#fff" stroke-width="1.75" stroke-linejoin="round">
    <use href="#long-loop"/>
    <use href="#long-loop" transform="rotate(22.5 120 120)"/>
    <use href="#long-loop" transform="rotate(45 120 120)"/>
    <use href="#long-loop" transform="rotate(67.5 120 120)"/>
    <use href="#long-loop" transform="rotate(90 120 120)"/>
    <use href="#long-loop" transform="rotate(112.5 120 120)"/>
    <use href="#long-loop" transform="rotate(135 120 120)"/>
    <use href="#long-loop" transform="rotate(157.5 120 120)"/>
    <use href="#long-loop" transform="rotate(180 120 120)"/>
    <use href="#long-loop" transform="rotate(202.5 120 120)"/>
    <use href="#long-loop" transform="rotate(225 120 120)"/>
    <use href="#long-loop" transform="rotate(247.5 120 120)"/>
    <use href="#long-loop" transform="rotate(270 120 120)"/>
    <use href="#long-loop" transform="rotate(292.5 120 120)"/>
    <use href="#long-loop" transform="rotate(315 120 120)"/>
    <use href="#long-loop" transform="rotate(337.5 120 120)"/>
  </g>

  <!-- Palette-colored secondary weave -->
  <g fill="none" stroke-width="2.2" stroke-linejoin="round">
    <use href="#middle-loop" stroke="#ff6651"/>
    <use href="#middle-loop" stroke="#ff8a3d" transform="rotate(45 120 120)"/>
    <use href="#middle-loop" stroke="#ffd84e" transform="rotate(90 120 120)"/>
    <use href="#middle-loop" stroke="#c9f34a" transform="rotate(135 120 120)"/>
    <use href="#middle-loop" stroke="#527cff" transform="rotate(180 120 120)"/>
    <use href="#middle-loop" stroke="#8a63d2" transform="rotate(225 120 120)"/>
    <use href="#middle-loop" stroke="#ff6651" transform="rotate(270 120 120)"/>
    <use href="#middle-loop" stroke="#527cff" transform="rotate(315 120 120)"/>
  </g>

  <!-- Concentric stitch rings -->
  <g fill="none" stroke-linecap="round">
    <circle cx="120" cy="120" r="105" stroke="#fff" stroke-width="3.4"/>
    <circle cx="120" cy="120" r="97" stroke="#17221c" stroke-width="1.4" stroke-dasharray="1 5" opacity=".75"/>
    <circle cx="120" cy="120" r="88" stroke="#fff" stroke-width="1.8" stroke-dasharray="5 3"/>
    <circle cx="120" cy="120" r="74" stroke="#ff6651" stroke-width="2.2" stroke-dasharray="3 4"/>
    <circle cx="120" cy="120" r="62" stroke="#fff" stroke-width="2.4"/>
    <circle cx="120" cy="120" r="51" stroke="#527cff" stroke-width="1.8" stroke-dasharray="2 3"/>
  </g>

  <!-- Scalloped handmade edge -->
  <g fill="none" stroke-width="1.8">
    <use href="#scallop" stroke="#fff"/>
    <use href="#scallop" stroke="#ff6651" transform="rotate(15 120 120)"/>
    <use href="#scallop" stroke="#fff" transform="rotate(30 120 120)"/>
    <use href="#scallop" stroke="#ff8a3d" transform="rotate(45 120 120)"/>
    <use href="#scallop" stroke="#fff" transform="rotate(60 120 120)"/>
    <use href="#scallop" stroke="#ffd84e" transform="rotate(75 120 120)"/>
    <use href="#scallop" stroke="#fff" transform="rotate(90 120 120)"/>
    <use href="#scallop" stroke="#c9f34a" transform="rotate(105 120 120)"/>
    <use href="#scallop" stroke="#fff" transform="rotate(120 120 120)"/>
    <use href="#scallop" stroke="#527cff" transform="rotate(135 120 120)"/>
    <use href="#scallop" stroke="#fff" transform="rotate(150 120 120)"/>
    <use href="#scallop" stroke="#8a63d2" transform="rotate(165 120 120)"/>
    <use href="#scallop" stroke="#fff" transform="rotate(180 120 120)"/>
    <use href="#scallop" stroke="#ff6651" transform="rotate(195 120 120)"/>
    <use href="#scallop" stroke="#fff" transform="rotate(210 120 120)"/>
    <use href="#scallop" stroke="#ff8a3d" transform="rotate(225 120 120)"/>
    <use href="#scallop" stroke="#fff" transform="rotate(240 120 120)"/>
    <use href="#scallop" stroke="#ffd84e" transform="rotate(255 120 120)"/>
    <use href="#scallop" stroke="#fff" transform="rotate(270 120 120)"/>
    <use href="#scallop" stroke="#c9f34a" transform="rotate(285 120 120)"/>
    <use href="#scallop" stroke="#fff" transform="rotate(300 120 120)"/>
    <use href="#scallop" stroke="#527cff" transform="rotate(315 120 120)"/>
    <use href="#scallop" stroke="#fff" transform="rotate(330 120 120)"/>
    <use href="#scallop" stroke="#8a63d2" transform="rotate(345 120 120)"/>
  </g>

  <!-- Inner lace flower -->
  <g fill="none" stroke-width="2" stroke-linejoin="round">
    <use href="#small-loop" stroke="#ff6651"/>
    <use href="#small-loop" stroke="#ffd84e" transform="rotate(45 120 120)"/>
    <use href="#small-loop" stroke="#c9f34a" transform="rotate(90 120 120)"/>
    <use href="#small-loop" stroke="#527cff" transform="rotate(135 120 120)"/>
    <use href="#small-loop" stroke="#8a63d2" transform="rotate(180 120 120)"/>
    <use href="#small-loop" stroke="#ff8a3d" transform="rotate(225 120 120)"/>
    <use href="#small-loop" stroke="#ffd84e" transform="rotate(270 120 120)"/>
    <use href="#small-loop" stroke="#527cff" transform="rotate(315 120 120)"/>
  </g>

  <circle cx="120" cy="120" r="37" fill="none" stroke="#fff" stroke-width="2.8" stroke-dasharray="2 3"/>
  <circle cx="120" cy="120" r="23" fill="none" stroke="#fff" stroke-width="3"/>
  <path d="m120 100 6 13 14-2-7 12 7 13-14-3-6 13-6-13-14 3 7-13-7-12 14 2Z" fill="#8a63d2" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="120" cy="120" r="6" fill="#ffd84e" stroke="#fff" stroke-width="2"/>
</svg>
